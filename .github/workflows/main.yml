name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.4
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Make Gradle executable
        run: chmod +x gradlew || true

      - name: Build APK
        run: gradle assembleDebug --stacktrace --full-stacktrace > build.log 2>&1 || true

      - name: Print Error Summary
        run: |
          echo "=================== BUILD LOG ERROR ==================="
          grep -A 20 "* What went wrong:" build.log || cat build.log | tail -n 50
          echo "======================================================="

      - name: Check Build Result
        run: |
          if grep -q "BUILD SUCCESSFUL" build.log; then
            echo "Build berhasil!"
          else
            echo "Build gagal, silakan periksa log di atas."
            exit 1
          fi

      - name: Upload APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
